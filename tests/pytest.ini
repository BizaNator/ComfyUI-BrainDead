# Why this file exists: the pack root is a ComfyUI custom-node package. Its __init__.py imports comfy_api
# (a live ComfyUI) and every node module. With no ini file here, pytest (>= 8) takes the pack root as the
# rootdir (via pyproject.toml), collects it as a Package and imports that __init__.py before the first
# test - so every test in tests/ errors with "ModuleNotFoundError: No module named 'comfy_api'".
# An ini file in tests/ makes tests/ the rootdir and the confcutdir, so the unit tests run without ComfyUI:
#     python -m pytest -q tests/test_parts_builder2_core.py        (from the pack root)
[pytest]
